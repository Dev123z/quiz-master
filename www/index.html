<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<title>QuizNova</title>
<style>
:root{--bg:#0b0820;--bg2:#1f1456;--card:#15113a;--tx:#f2f0ff;--mu:#9d99cf;--a:#a855f7;--b:#22d3ee;--ok:#16a34a;--bad:#dc2626;--ln:#2e2866}
[data-t=sunset]{--bg:#1c0a14;--bg2:#4a1230;--card:#2a1020;--a:#fb7185;--b:#fbbf24;--ln:#5a2440}
[data-t=forest]{--bg:#06150f;--bg2:#0b3a2a;--card:#0e2a1f;--a:#22c55e;--b:#a3e635;--ln:#1b5a40}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,Roboto,sans-serif;background:radial-gradient(circle at 20% 0,var(--bg2),var(--bg) 60%) fixed;color:var(--tx);min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:16px 14px 100px;animation:fi .3s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.na *{animation:none!important;transition:none!important}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--b);outline-offset:2px}
h1,h2,h3{margin:8px 0}
small,.lab{color:var(--mu)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:17px;color:#fff;background:linear-gradient(90deg,var(--a),var(--b));box-shadow:0 0 22px rgba(168,85,247,.45);cursor:pointer;margin:12px 0}
.btn.alt{background:transparent;border:2px solid var(--ln);box-shadow:none}
.btn.red{background:var(--bad);box-shadow:none}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--ln);border-radius:18px;padding:14px;margin:12px 0}
.hd{display:flex;align-items:center;gap:12px}
.hd>div:nth-child(2){flex:1}
.av{width:56px;height:56px;border-radius:50%;border:3px solid var(--ln);display:grid;place-items:center;font-size:30px;background:var(--card)}
.coin{font-weight:800;background:var(--card);border:1px solid var(--ln);padding:8px 12px;border-radius:20px}
.chip{display:inline-block;padding:4px 10px;border-radius:14px;background:var(--card);border:1px solid var(--rc,var(--ln));color:var(--rc,var(--tx));font-size:13px;font-weight:700;margin:2px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:10px;text-align:center}
.stats b{display:block;font-size:20px;color:var(--b)}
.bar{height:10px;background:var(--ln);border-radius:10px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));transition:width .5s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--card);border:1px solid var(--ln);border-radius:16px;padding:14px 6px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.cat span{font-size:32px}
.cat{position:relative;background:linear-gradient(160deg,var(--card),var(--bg2))}.cat em{position:absolute;top:6px;right:6px;font-size:10px;font-style:normal;font-weight:800;padding:2px 7px;border-radius:10px;background:linear-gradient(90deg,var(--a),var(--b));color:#fff}.cat small{font-weight:400;font-size:12px}.cat:hover{border-color:var(--a);box-shadow:0 0 16px rgba(168,85,247,.35)}
.cat:active{transform:scale(.95);border-color:var(--b)}
.qh{display:flex;flex-wrap:wrap;gap:4px;justify-content:space-between}
.t0{color:#4ade80}.t1{color:#22d3ee}.t2{color:#facc15}.t3{color:#fb923c}.t4{color:#f472b6}
.q{background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:20px;font-size:20px;font-weight:700;line-height:1.35;margin:10px 0;text-align:center}
.q .em{font-size:44px;display:block}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid var(--ln);border-radius:16px;padding:15px;font-size:17px;margin-bottom:10px;cursor:pointer}
.opt b{background:var(--ln);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;flex:none}
.opt.ok{background:var(--ok);border-color:var(--ok)}
.opt.bad{background:var(--bad);border-color:var(--bad)}
.fb{text-align:center;font-weight:800;margin:8px 0}
.row{display:flex;align-items:center;gap:12px}
.row>div{flex:1}
.row .btn{width:auto;margin:0;padding:10px 14px;font-size:15px}
input[type=text],select{width:100%;background:var(--card);border:2px solid var(--ln);border-radius:12px;padding:12px;margin:6px 0 12px}
#nav{position:fixed;left:0;right:0;bottom:0;display:none;background:var(--card);border-top:1px solid var(--ln);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around}
#nav button{background:none;border:0;padding:6px 12px;border-radius:12px;color:var(--mu);font-size:12px;cursor:pointer}
#nav button span{display:block;font-size:22px}
#nav .on{color:var(--b);background:var(--bg2)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:9;padding:20px}
#modal.on{display:grid}
.mb{background:var(--card);border:2px solid var(--b);border-radius:22px;padding:22px;text-align:center;max-width:340px;width:100%;box-shadow:0 0 40px var(--a);animation:fi .3s}
.big{font-size:64px}
.tmr{display:flex;align-items:center;gap:12px;background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--ln);border-radius:20px;padding:10px 12px;margin:0 0 10px;--tc:var(--b);transition:border-color .3s}
.tmr .ring{position:relative;width:62px;height:62px;flex:none}
.tmr .ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.tmr .ring circle{fill:none;stroke-width:6}
.tmr .tr{stroke:var(--ln)}
.tmr .tg{stroke:var(--tc);stroke-linecap:round;stroke-dasharray:163.4;transition:stroke-dashoffset .25s linear,stroke .3s;filter:drop-shadow(0 0 4px var(--tc))}
.tmr .ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--tc)}
.tmr .tx{flex:1;min-width:0}
.tmr .tx span{font-size:13px;font-weight:800;color:var(--tc)}
.tbar{height:8px;background:var(--ln);border-radius:8px;overflow:hidden;margin-top:6px}
.tbar i{display:block;height:100%;width:100%;background:var(--tc);border-radius:8px;transition:width .25s linear,background .3s}
.tmr.w10{--tc:#facc15;border-color:#facc1599}
.tmr.w5{--tc:#ef4444;border-color:#ef4444;animation:tpulse .5s infinite}
.tmr.w10 .ring{animation:tbeat 1s infinite}
.tmr.w5 .ring{animation:tbeat .5s infinite}
.tmr.stop{--tc:var(--mu)}
.tmr.out{--tc:#ef4444;border-color:#ef4444}
@keyframes tpulse{50%{box-shadow:0 0 22px rgba(239,68,68,.55)}}
@keyframes tbeat{50%{transform:scale(1.1)}}
.pub{margin:6px 0}
.puh{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:800;margin:6px 2px}
.puh span:last-child{color:#facc15}
.pus{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pu{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:16px;border:2px solid var(--ln);background:linear-gradient(160deg,var(--card),var(--bg2));color:var(--tx);cursor:pointer;min-width:0;font-family:inherit}
.pu .pi{font-size:24px;line-height:1}
.pu b{font-size:12px}
.pu small{font-size:10.5px}
.pu em{font-style:normal;font-size:12px;font-weight:800;padding:2px 8px;border-radius:10px;background:var(--ln);margin-top:3px}
.pu:active{transform:scale(.95)}
.pu.poor{opacity:.55}.pu.poor em{color:#f87171}
.pu.used{border-color:var(--ok)}.pu.used em{background:var(--ok);color:#fff}
.pu:disabled{opacity:.4;cursor:not-allowed}
.opt.gone{opacity:.28;text-decoration:line-through}
.rv{margin:6px 0 10px;border:1px solid var(--ln);border-radius:18px;overflow:hidden;background:linear-gradient(160deg,var(--card),var(--bg2));animation:fi .3s}
.rv .box{position:relative;aspect-ratio:16/9;max-height:190px;width:100%;display:grid;place-items:center;overflow:hidden}
.rv img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}
.rv img.ok{opacity:1}
.sk{position:absolute;inset:0;background:linear-gradient(100deg,var(--card) 30%,var(--ln) 50%,var(--card) 70%);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.fbk{position:absolute;inset:0;display:none;place-items:center;font-size:64px}
.rv.err .fbk{display:grid}.rv.err .sk,.rv.ok .sk{display:none}
.rv svg{width:auto;height:88%;max-width:60%}
.rv .cap{font-size:11px;color:var(--mu);padding:6px 12px;display:flex;justify-content:space-between;gap:10px}
.rv .cap span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.rv .cap a,.card a{color:var(--b)}
.i1{fill:var(--a)}.i2{fill:var(--b)}.i3{fill:var(--tx)}.i4{fill:var(--bg)}.is{fill:none;stroke:var(--tx);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--a);color:#fff;padding:10px 16px;border-radius:20px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .3s;z-index:10;max-width:90%;text-align:center}
#toast.on{opacity:1}
</style>
</head>

function expire(){markSeen(cur,catSel);S.answered++;S.to=(S.to||0)+1;R=null;S.run=null;save()}
function timeUp(){if(lock||!cur||!R)return;lock=true;const q=cur,hn=R.hn.slice(),wr=R.wr.slice(),tot=R.tot;expire();fb={to:1,ok:false,i:-1,x:0,c:0,left:0,tot,hn,wr};beep(false);render();advT=setTimeout(()=>{if(scr==="quiz"&&cur===q&&fb&&fb.to)startQuiz(catSel)},2200)}
function choose(i){if(lock||!cur||!R||fb)return;const o=opts[i];if(o===undefined||R.hn.includes(o)||R.wr.includes(o))return;if(Date.now()>=R.end){timeUp();return}lock=true;const q=cur,ok=o===q.a;
if(!ok&&R.rt===1){R.rt=2;R.wr.push(o);save();lock=false;beep(false);toast(_t("Wrong! Retry used. Pick again."));render();return}
const left=Math.max(0,Math.ceil((R.end-Date.now())/1000)),tot=R.tot,hn=R.hn.slice(),wr=R.wr.slice(),rep=done.has(q.id);if(!rep){done.add(q.id);S.done.push(q.id)}markSeen(q,catSel);S.answered++;let x=0,c=0;if(ok){S.correct++;if(!rep&&!paid.has(q.id)){paid.add(q.id);S.paid.push(q.id);x=XPT[q.t];c=COINT[q.t];S.score+=x;award(x,c)}}R=null;S.run=null;save();fb={i,ok,x,c,rep,left,tot,hn,wr};beep(ok);render()}
function buy(k){const c=PC[k];if(!c||lock||fb||!cur||!R)return;if(Date.now()>=R.end){timeUp();return}if(k==="x"&&R.ex||k==="h"&&R.hn.length||k==="r"&&R.rt)return;if(!(S.coins>=c)){toast(_t("Not enough coins. You need {0} more 🪙",Math.ceil(c-S.coins)));return}
let live=[];if(k==="h"){live=opts.filter(o=>o!==cur.a&&!R.wr.includes(o));if(live.length<3){toast(_t("Hint not available now"));return}}
S.coins-=c;if(k==="x"){R.ex=1;R.end+=XT*1000;R.tot=TL+XT;toast(_t("+20 seconds!"))}else if(k==="h"){R.hn=shuf(live).slice(0,2);toast(_t("Two wrong answers removed"))}else{R.rt=1;toast(_t("Retry armed: you get a second chance"))}save();render()}
function tick(){if(scr!=="quiz"||!R||fb)return;const ms=R.end-Date.now();if(ms<=0){timeUp();return}const s=Math.ceil(ms/1000),w=$("#tm");if(w){w.className="tmr"+(s<=5?" w5":s<=10?" w10":"");$("#tms").textContent=s;$("#tmm").textContent=s<=5?_t("Hurry up!"):s<=10?_t("Time is running out"):_t("Time left");const p=Math.max(0,Math.min(1,ms/(R.tot*1000)));$("#tmc").style.strokeDashoffset=163.4*(1-p);$("#tmb").style.width=p*100+"%"}if(s<lastSec&&s<=5)tickBeep();lastSec=s}
function tickBeep(){if(!S.snd)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=900;g.gain.value=.04;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.05)}catch(e){}}
function leave(){if(scr==="quiz"&&R){if((R.ex||R.hn.length||R.rt)&&!confirm(_t("Leave this question? Coins spent on power-ups will not be refunded.")))return false;R=null;S.run=null;save()}clearTimeout(advT);return true}
function resume(){const r=S.run;if(!r){try{const j=JSON.parse(localStorage.getItem(KEY)||"null");if(j&&j.run)save()}catch(e){}return}if(!S.setup){S.run=null;save();return}const q=STATIC.find(x=>x.id===r.id);if(!q){S.run=null;save();return}cur=q;catSel=r.cat;opts=r.opts.slice();R=r;fb=null;lock=false;if(r.end<=Date.now()){expire();cur=null;toast(_t("⏰ Time ran out on your last question"));return}scr="quiz"}
function setup(){return `<h1>🚀 ${_t("Welcome to QuizNova")}</h1><p class="lab">${_t("Set up your player")}</p><label for="nm">${_t("Player name")}</label><input type="text" id="nm" maxlength="16" value="${esc(S.name==="Player"?"":S.name)}" placeholder="Player"><label for="lg">${_t("Preferred language")}</label><select id="lg" data-c="lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${S.lang===k?" selected":""}>${esc(v)}</option>`).join("")}</select><label for="co">${_t("Country")}</label><select id="co">${COUNTRIES.map(c=>`<option${S.country===c?" selected":""}>${esc(c)}</option>`).join("")}</select><div class="card"><small>${_t("Some questions are not translated yet and appear in English.")}</small></div><button class="btn" data-a="cont">${_t("Continue")}</button>`}
function home(){const I=info(),ri=rankIdx(),nx=RANKS[ri+1],ok=S.last!==fmt(new Date());return `<header class="hd">${av()}<div><b>${esc(S.name)}</b><div>${chip(ri)}<small> ${_t("Level")} ${I.l}</small></div></div><div class="coin">🪙 ${S.coins}</div></header><div class="stats"><div><b>${S.xp}</b><small>${_t("Total XP")}</small></div><div><b>${S.score}</b><small>${_t("Score")}</small></div><div><b>${S.correct}</b><small>${_t("Correct")}</small></div></div><div class="lab">${_t("Level")} ${I.l} · ${I.r}/${I.n} XP</div>${bar(I.r/I.n)}<button class="btn" data-a="play" data-v="mix">▶ ${_t("Play Quiz")}</button><h2>${_t("Categories")}</h2><div class="grid">${Object.entries(CATS).map(([k,v])=>`<button class="cat" data-a="play" data-v="${k}"><span>${v[1]}</span>${esc(_t(v[0]))}${NEWCATS.includes(k)?'<em>${_t("NEW")}</em>':""}<small>${STATIC.filter(x=>x.c===k&&!done.has(x.id)).length} ${_t("left")}</small></button>`).join("")}</div><div class="card"><h3>🎁 ${_t("Daily Reward")}</h3><p>${_t("Streak: {0} day(s)","<b>"+S.streak+"</b>")}</p>${ok?`<button class="btn" data-a="claim">${_t("Claim today's reward")}</button>`:`<p class="lab">${_t("Claimed today. Next reward in")} <b>${cd()}</b></p>`}</div><div class="card"><h3>🏆 ${_t("Rank progress")}</h3>${nx?`${chip(ri)} → ${chip(ri+1)}${bar((S.xp-RANKS[ri][3])/(nx[3]-RANKS[ri][3]))}<small>${S.xp}/${nx[3]} XP</small>`:`${chip(ri)} ${_t("You reached the highest rank!")}`}</div>`}
function tmHTML(){let s,p,cls="tmr",lab=_t("Time left");if(R&&!fb){const ms=Math.max(0,R.end-Date.now());s=Math.ceil(ms/1000);p=Math.min(1,ms/(R.tot*1000));cls+=s<=5?" w5":s<=10?" w10":""}else{s=fb?fb.left:0;p=fb&&fb.tot?fb.left/fb.tot:0;if(fb&&fb.to){cls+=" out";lab=_t("Time's up!")}else{cls+=" stop";lab=_t("Timer stopped")}}
return `<div class="${cls}" id="tm" role="timer" aria-label="${_t("Time left")}"><div class="ring"><svg viewBox="0 0 64 64" aria-hidden="true"><circle class="tr" cx="32" cy="32" r="26"/><circle class="tg" id="tmc" cx="32" cy="32" r="26" style="stroke-dashoffset:${(163.4*(1-p)).toFixed(1)}"/></svg><b id="tms">${s}</b></div><div class="tx"><span id="tmm">${s<=5&&R&&!fb?_t("Hurry up!"):s<=10&&R&&!fb?_t("Time is running out"):lab}</span><div class="tbar"><i id="tmb" style="width:${(p*100).toFixed(1)}%"></i></div></div><div class="coin" id="cn">🪙 ${S.coins}</div></div>`}
function pubar(){const live=opts.filter(o=>o!==cur.a&&!R.wr.includes(o)).length,D={x:["⏱️",_t("Extra Time"),_t("+20 seconds"),!!R.ex,_t("Used ✓"),0],h:["✂️",_t("50% Hint"),_t("Remove 2 wrong"),!!R.hn.length,_t("Used ✓"),live<3],r:["🔁",_t("Retry"),_t("2nd chance"),!!R.rt,R.rt===2?_t("Used ✓"):_t("Armed ✓"),0]};
return `<div class="pub"><div class="puh"><span>⚡ ${_t("Power-ups")}</span><span>🪙 ${S.coins} ${_t("coins")}</span></div><div class="pus">${Object.entries(D).map(([k,[ic,n,d,used,ut,off]])=>`<button class="pu${used?" used":S.coins<PC[k]?" poor":""}" data-a="buy" data-v="${k}" title="${n}: ${d}"${used||off?" disabled":""}><span class="pi">${ic}</span><b>${n}</b><small>${d}</small><em>${used?ut:"🪙 "+PC[k]}</em></button>`).join("")}</div></div>`}
function quiz(){const q=cur,c=CATS[q.c],I=info(),gone=o=>(fb?fb.hn:R&&R.hn||[]).includes(o),was=o=>(fb?fb.wr:R&&R.wr||[]).includes(o);return `${tmHTML()}<div class="qh"><span class="chip">${c[1]} ${esc(_t(c[0]))}</span><span class="chip t${q.t}">${_t(TIERS[q.t])}</span><span class="chip">${_t("Lv")} ${I.l}</span><span class="chip">Q #${fb?S.answered:S.answered+1}</span></div>${bar(I.r/I.n)}<div class="q"><span class="em">${q.e}</span>${esc(trq(q))}</div>${opts.map((o,i)=>{let k="opt";const g=gone(o),w=was(o);if(fb){if(o===q.a)k+=" ok";else if(i===fb.i||w)k+=" bad"}else if(w)k+=" bad";if(g&&o!==q.a)k+=" gone";return `<button class="${k}" data-a="ch" data-v="${i}"${fb||g||w?" disabled":""}><b>${"ABCD"[i]}</b>${esc(tro(q,o))}</button>`}).join("")}${fb?(fb.to?`<div class="fb">${_t("⏰ Time's up! No XP or coins. Next question loading…")}</div><button class="btn" data-a="next">${_t("Next Question →")}</button>`:`<div class="fb">${fb.ok?(fb.x||fb.c?_t("✅ Correct! +{0} XP · +{1} 🪙",fb.x,fb.c):_t("✅ Correct! No rewards for repeat questions.")):_t("❌ Incorrect. No XP earned.")}</div>${reveal(q)}<button class="btn" data-a="next">${_t("Next Question →")}</button>`):`${pubar()}<p class="lab" style="text-align:center">${_t("Choose the correct answer.")}</p>`}<button class="btn alt" data-a="go" data-v="home">${_t("Exit to Home")}</button>`}
function empty(){return `<div class="card" style="text-align:center"><div class="big">📭</div><h2>No new questions available</h2><p>You have answered every question available for this selection. Try another category.</p></div><button class="btn" data-a="play" data-v="mix">Try all categories</button><button class="btn alt" data-a="go" data-v="home">Back to Home</button>`}
function ranks(){const ri=rankIdx();return `<h1>🏆 ${_t("Ranks")}</h1><p class="lab">${_t("Total XP")}: ${S.xp}</p>`+RANKS.map((r,i)=>`<div class="card" style="border-color:${r[2]}"><div class="row"><span style="font-size:36px">${r[1]}</span><div><b style="color:${r[2]}">${_t(r[0])}</b><br><small>${_t("Requires")} ${r[3]} XP · ${_t("Reward")} 🪙 ${r[4]}</small></div><span>${i<=ri?"✅":"🔒"}</span></div>${bar(i<ri?1:i===ri?1:0)}</div>`).join("")}
function prof(){const I=info(),ri=rankIdx(),acc=S.answered?Math.round(S.correct/S.answered*100):0;return `<h1>👤 ${_t("Profile")}</h1><div class="hd">${av()}<div><b>${esc(S.name)}</b><div>${chip(ri)}</div></div></div><div class="stats"><div><b>${I.l}</b><small>${_t("Level")}</small></div><div><b>${S.xp}</b><small>XP</small></div><div><b>${S.coins}</b><small>${_t("Coins")}</small></div><div><b>${S.answered}</b><small>${_t("Answered")}</small></div><div><b>${S.correct}</b><small>${_t("Correct")}</small></div><div><b>${acc}%</b><small>${_t("Accuracy")}</small></div></div><div class="card"><h3>${_t("Settings")}</h3><label for="pl">${_t("Language")}</label><select id="pl" data-c="lang">${Object.entries(LANGS).map(([k,v])=>`<option value="${k}"${S.lang===k?" selected":""}>${esc(v)}</option>`).join("")}</select><label for="pc">${_t("Country")}</label><select id="pc" data-c="co">${COUNTRIES.map(c=>`<option${S.country===c?" selected":""}>${esc(c)}</option>`).join("")}</select><small>${_t("Some questions are not translated yet and appear in English.")}</small><p><label><input type="checkbox" data-c="snd"${S.snd?" checked":""}> ${_t("Sound effects")}</label></p><p><label><input type="checkbox" data-c="anim"${S.anim?" checked":""}> ${_t("Animations")}</label></p></div><div class="card"><h3>📷 ${_t("Credits")}</h3><small>${_t("Photo licences and attribution")}</small><button class="btn alt" data-a="go" data-v="credits">${_t("View photo credits")}</button></div><div class="card"><h3>${_t("Backup")}</h3><button class="btn" data-a="exp">${_t("Export Progress Backup")}</button><label for="imp">${_t("Import Progress Backup (.json)")}</label><input type="file" id="imp" accept=".json,application/json" data-c="imp"></div><button class="btn alt" data-a="rsth">${_t("Reset Question History")}</button><button class="btn red" data-a="rsall">${_t("Reset All Progress")}</button>`}
function claim(){const t=fmt(new Date());if(S.last===t)return;const n=new Date(),y=fmt(new Date(n.getFullYear(),n.getMonth(),n.getDate()-1));S.streak=S.last===y?S.streak+1:1;S.last=t;const k=Math.min(S.streak,7),c=40+20*(k-1),x=10*k;award(x,c);save();pop("🎁",_t("Daily reward!"),_t("Day {0}: +{1} coins and +{2} XP",S.streak,c,x));render()}
function exp(){const b=new Blob([JSON.stringify({...S,run:null},null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="quiznova-backup.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||o.v!==1||!Array.isArray(o.done)||!Array.isArray(o.paid))throw Error();if(!confirm("Importing replaces current progress. Continue?"))return;S=fix({...DEF(),...o});S.run=null;R=null;cur=null;fb=null;clearTimeout(advT);rebuild();save();scr=S.setup?"home":"setup";render();toast(_t("Backup imported"))}catch(e){toast("Invalid backup file")}};r.readAsText(f)}
function rsth(){if(!confirm("Restart question cycles? Your lifetime question history is kept, and repeated questions still give no XP or coins."))return;const n={};for(const k of["mix",...Object.keys(CATS)])n[k]={n:S.cyc[k]&&S.cyc[k].n>=1?S.cyc[k].n:1,s:[]};S.cyc=n;save();toast(_t("Question cycles restarted"))}
function rsall(){if(!confirm("Delete all local progress?"))return;try{localStorage.removeItem(KEY)}catch(e){}S=DEF();R=null;cur=null;fb=null;clearTimeout(advT);rebuild();scr="setup";render()}
const ACT={go:v=>{if(!leave())return;scr=v;render()},buy,play:v=>startQuiz(CATS[v]?v:"mix"),ch:v=>choose(+v),next:()=>startQuiz(catSel),ok:closePop,claim,exp,rsth,rsall,cont:()=>{S.name=$("#nm").value.trim().slice(0,16)||"Player";S.lang=$("#lg").value;S.country=$("#co").value;S.setup=true;save();scr="home";render()}};
const CH={lang:v=>{if(LANGS[v]){if(scr==="setup"){const n=$("#nm"),c=$("#co");if(n&&n.value.trim())S.name=n.value.trim().slice(0,16);if(c)S.country=c.value}S.lang=v;save();render()}},co:v=>{if(COUNTRIES.includes(v))S.country=v;save()},snd:(v,e)=>{S.snd=e.checked;save()},anim:(v,e)=>{S.anim=e.checked;document.body.classList.toggle("na",!S.anim);save()},imp:(v,e)=>{imp(e.files[0]);e.value=""}};
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(!b)return;const fn=ACT[b.dataset.a];if(fn)fn(b.dataset.v)});
document.addEventListener("change",e=>{const b=e.target.closest("[data-c]");if(!b)return;const fn=CH[b.dataset.c];if(fn)fn(b.value,b)});
document.addEventListener("keydown",e=>{if(scr!=="quiz"||$("#modal").classList.contains("on"))return;if(!fb&&"1234".includes(e.key))choose(+e.key-1);else if(fb&&e.key.toLowerCase()==="n")startQuiz(catSel)});
function render(){document.body.classList.toggle("na",!S.anim);$("#app").innerHTML=({setup,home,quiz,empty,ranks,prof,credits})[scr]?.()||home();document.documentElement.lang=S.lang;document.querySelectorAll("#nav button").forEach(b=>{const n=b.childNodes[1],k={home:"Home",ranks:"Ranks",prof:"Profile"}[b.dataset.v];if(n&&k)n.textContent=_t(k)});$("#nav").style.display=["home","ranks","prof","credits"].includes(scr)?"flex":"none";document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===scr||(scr==="credits"&&b.dataset.v==="prof")));if(scr!==lastScr){window.scrollTo(0,0);lastScr=scr}if(scr==="quiz"&&fb&&!fb.to)hydrate();}
S=load();rebuild();scr=S.setup?"home":"setup";resume();render();setInterval(tick,200);document.addEventListener("visibilitychange",()=>{if(!document.hidden)tick()});
})();
</script>
